# CI for the React + TypeScript SPA: install, typecheck, unit tests, production build.

name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (strict TypeScript)
        run: npx tsc -b --noEmit

      - name: Unit tests (vitest)
        run: npm test

      - name: Production build + bundle check
        run: |
          npm run build
          test -f dist/index.html || { echo "dist/index.html missing"; exit 1; }
          JS=$(ls dist/assets/*.js | head -1)
          SIZE=$(stat -c%s "$JS")
          echo "bundle: $JS ($SIZE bytes)"
          if [ "$SIZE" -gt 1500000 ]; then echo "bundle too large"; exit 1; fi

      - name: Upload frontend dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: cafe-frontend-dist
          path: frontend/dist
