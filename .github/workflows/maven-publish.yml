# CI for the Spring Boot backend + publish to GitHub Packages on release.
# FIX vs baseline: JDK 11 -> 17 (pom requires 17), MySQL 8 service for @SpringBootTest
# tests (previously guaranteed to fail), `mvn verify` (runs *IT integration tests too),
# and an explicit artifact upload per release commit.

name: Backend CI & Package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: CafeMgt
          MYSQL_USER: cafe
          MYSQL_PASSWORD: cafe123
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: github
          settings-path: ${{ github.workspace }}

      - name: Build and test with Maven
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/CafeMgt
          DB_USERNAME: cafe
          DB_PASSWORD: cafe123
        run: mvn -B verify --file pom.xml

      - name: Upload backend JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: cafe-backend
          path: target/*.jar

      - name: Publish to GitHub Packages (releases only)
        if: github.event_name == 'release'
        run: mvn deploy -DskipTests -s $GITHUB_WORKSPACE/settings.xml
        env:
          GITHUB_TOKEN: ${{ github.token }}
