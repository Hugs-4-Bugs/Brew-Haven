spring.application.name=cafe-management-system

# ================= Database Configuration =================
# Externalized via environment variables (FIX: a real DB password was previously committed).
# Local defaults work out of the box with a standard local MySQL/MariaDB root account.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/CafeMgt?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ================= JPA & Hibernate =================
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect.storage_engine=innodb

# ================= Connection Pooling =================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000

# ================= Server =================
server.port=8000

# ================= Mail (required for forgot-password + admin notifications) =================
# Configure real SMTP credentials via environment variables in every non-local environment.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:your_email}
spring.mail.password=${MAIL_PASSWORD:your_email_app_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
cafe.mail.from=${MAIL_FROM:noreply@cafemgt.local}

# ================= First-admin bootstrap (FIX A.4) =================
# When set AND no admin exists, an approved admin account is created at startup.
cafe.bootstrap.admin-email=${CAFE_BOOTSTRAP_ADMIN_EMAIL:}
cafe.bootstrap.admin-password=${CAFE_BOOTSTRAP_ADMIN_PASSWORD:}

# ================= Bill PDF storage (FIX B.1) =================
cafe.bill.store-location=${CAFE_BILL_STORE_LOCATION:./Bill Document}

# ================= UPI QR configuration (Issue #4) =================
# The merchant payee that ALL generated UPI QR codes encode (backend-authoritative).
# If not configured, QR generation fails safe with HTTP 503 instead of producing a QR
# that would send money to an arbitrary payee.
# Bundled default: the shop's real collection VPA (PhonePe/YBL). Override with
# CAFE_UPI_PAYEE_VPA to repoint every QR at a different merchant account.
cafe.upi.payee-vpa=${CAFE_UPI_PAYEE_VPA:7250063206-3@ybl}
cafe.upi.payee-name=${CAFE_UPI_PAYEE_NAME:Brew Haven Cafe}
cafe.upi.currency=${CAFE_UPI_CURRENCY:INR}

# ================= Excel import limits (Issue #2) =================
cafe.excel.max-file-size-bytes=${CAFE_EXCEL_MAX_FILE_BYTES:5242880}
cafe.excel.max-rows=${CAFE_EXCEL_MAX_ROWS:5000}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ================= JWT (FIX: secret externalized; keep >= 32 bytes for HS256) =================
cafe.jwt.secret=${JWT_SECRET:itachiuchiha12345678901234567890itachiuchiha12345678901234567890itachiuchiha12345678901234567890}

# ================= Graceful shutdown =================
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# ================= Payment platform (checkout) =================
# Provider selection: AUTO (default — RAZORPAY when keys are present, else SANDBOX)
# | SANDBOX (local test mode, no external calls) | RAZORPAY (production — fails fast without keys).
cafe.payment.provider=${PAYMENT_PROVIDER:AUTO}
# Razorpay credentials — PUBLIC key id, server-only key secret, webhook secret.
# NEVER commit real values; supply them as environment variables.
cafe.payment.razorpay.key-id=${PAYMENT_PROVIDER_KEY:}
cafe.payment.razorpay.key-secret=${PAYMENT_PROVIDER_SECRET:}
cafe.payment.razorpay.webhook-secret=${PAYMENT_PROVIDER_WEBHOOK_SECRET:}
# Optional tax/fee percent applied on the discounted base (0 = tax-inclusive menu prices).
cafe.payment.tax-percent=${CAFE_PAYMENT_TAX_PERCENT:0}
# Payment-intent lifetime before automatic EXPIRED transition.
cafe.payment.intent-expiry-minutes=${CAFE_PAYMENT_INTENT_EXPIRY_MINUTES:15}
